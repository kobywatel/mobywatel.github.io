    <script>
        const demoState = {
            name: '',
            surname: '',
            sex: '',
            pesel: '',
            birthPlace: '',
            country: '',
            address1: '',
            address2: '',
            city: '',
            school: '',
            schoolAddress: '',
            schoolPhone: '',
            director: ''
        };

        const formMap = {
            name: 'techName',
            surname: 'techSurname',
            sex: 'techSex',
            pesel: 'techPesel',
            birthPlace: 'techBirthPlace',
            country: 'techCountry',
            address1: 'techAddress1',
            address2: 'techAddress2',
            city: 'techCity',
            school: 'techSchool',
            schoolAddress: 'techSchoolAddress',
            schoolPhone: 'techSchoolPhone',
            director: 'techDirector'
        };

        const demoInputs = document.querySelectorAll('.demo-field input');
        const demoMap = {
            name: document.querySelectorAll('.demo-field input')[0],
            surname: document.querySelectorAll('.demo-field input')[1],
            sex: document.querySelectorAll('.demo-field input')[2],
            pesel: document.querySelectorAll('.demo-field input')[3],
            birthPlace: document.querySelectorAll('.demo-field input')[4],
            country: document.querySelectorAll('.demo-field input')[5],
            address1: document.querySelectorAll('.demo-field input')[6],
            address2: document.querySelectorAll('.demo-field input')[7],
            city: document.querySelectorAll('.demo-field input')[8],
            school: document.querySelectorAll('.demo-field input')[9],
            schoolAddress: document.querySelectorAll('.demo-field input')[10],
            schoolPhone: document.querySelectorAll('.demo-field input')[11],
            director: document.querySelectorAll('.demo-field input')[12]
        };

        function loadDemoState() {
            const saved = JSON.parse(localStorage.getItem('demoState') || '{}');
            Object.keys(demoState).forEach((key) => {
                demoState[key] = saved[key] ?? '';
            });
        }

        function renderDemoState() {
            Object.entries(demoState).forEach(([key, value]) => {
                const target = demoMap[key];
                if (target) target.value = value || '';
                const editorInput = document.getElementById(formMap[key]);
                if (editorInput) editorInput.value = value || '';
            });
        }

        function saveDemoState() {
            localStorage.setItem('demoState', JSON.stringify(demoState));
            renderDemoState();
        }

        const techEditor = document.getElementById('techEditor');
        const techTrigger = document.querySelector('.tech-trigger');
        const techClose = document.querySelector('.tech-close');
        const techSave = document.querySelector('.tech-save');

        function toggleTechEditor(forceOpen) {
            const shouldOpen = typeof forceOpen === 'boolean' ? forceOpen : !techEditor.classList.contains('visible');
            techEditor.classList.toggle('visible', shouldOpen);
            localStorage.setItem('techEditorVisible', shouldOpen ? '1' : '0');
        }

        let clickCounter = 0;
        let clickTimer = null;

        if (techTrigger) {
            techTrigger.addEventListener('click', () => {
                clickCounter += 1;
                clearTimeout(clickTimer);
                clickTimer = setTimeout(() => { clickCounter = 0; }, 700);

                if (clickCounter >= 3) {
                    toggleTechEditor(true);
                    clickCounter = 0;
                }
            });
        }

        if (techClose) {
            techClose.addEventListener('click', () => toggleTechEditor(false));
        }

        if (techSave) {
            techSave.addEventListener('click', () => {
                Object.keys(demoState).forEach((key) => {
                    const input = document.getElementById(formMap[key]);
                    if (input) demoState[key] = input.value || '';
                });
                saveDemoState();
                toggleTechEditor(false);
            });
        }

        loadDemoState();
        renderDemoState();
        toggleTechEditor(false);
    </script>
